<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f8;--card:#fff;--text:#14161a;--text2:#7a808b;--border:#ececef;--accent:#2a78d6;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#111213;--card:#1a1a19;--text:#f0efec;--text2:#94938b;--border:#2e2f2d;--accent:#3987e5;--err:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px}
h1{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 20px;color:var(--text2);font-size:13px}
input{width:100%;font:inherit;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#f{min-height:20px;margin-top:10px;font-size:13px;color:var(--err)}
</style>
</head>
<body>
<form id="form" autocomplete="off">
  <h1>Geschütztes Dashboard</h1>
  <p>Bitte Passwort eingeben.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Passwort" autofocus required>
  <button id="btn" type="submit">Öffnen</button>
  <div id="f" role="alert"></div>
</form>

  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:bytes(D.salt), iterations:D.runden, hash:"SHA-256"}, basis, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const klar = await crypto.subtle.decrypt({name:"AES-GCM", iv:bytes(D.iv)}, key, bytes(D.daten));
  const html = new TextDecoder().decode(klar);
  document.open(); document.write(html); document.close();
}
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), f = document.getElementById("f"), pw = document.getElementById("pw").value;
  if (!window.crypto || !crypto.subtle){ f.textContent = "Dieser Browser unterstützt die Entschlüsselung nicht."; return; }
  btn.disabled = true; btn.textContent = "Wird geöffnet …"; f.textContent = "";
  try { await oeffnen(pw); }
  catch(err){ btn.disabled = false; btn.textContent = "Öffnen"; f.textContent = "Passwort falsch."; }
});
